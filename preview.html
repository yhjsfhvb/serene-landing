<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serene — Beauty & Wellness</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0c;
      overflow-x: hidden;
    }

    .font-inter { font-family: 'Inter', sans-serif; }
    .font-instrument { font-family: 'Instrument Serif', serif; }

    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .text-glow {
      text-shadow: 0 0 40px rgba(255, 255, 255, 0.4), 0 0 80px rgba(255, 255, 255, 0.2), 0 0 120px rgba(255, 255, 255, 0.1);
    }

    .button-glow {
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3), 0 0 40px rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // ========== Navbar ==========
    const navLinks = ['About', 'Services', 'Journal', 'Contact'];

    function Navbar() {
      const [menuOpen, setMenuOpen] = useState(false);

      return (
        <>
          <nav className="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-6 md:px-12 py-5">
            {/* Brand */}
            <a href="#" className="text-white text-2xl md:text-3xl" style={{ fontFamily: "'Dancing Script', cursive" }}>
              Serene
            </a>

            {/* Desktop nav links */}
            <div className="hidden md:flex items-center gap-12">
              {navLinks.map((link) => (
                <a key={link} href="#" className="text-white/80 hover:text-white text-sm tracking-wide transition-colors duration-300">
                  {link}
                </a>
              ))}
            </div>

            {/* Desktop CTA */}
            <button className="hidden md:block bg-white text-black px-8 py-3.5 rounded-full font-medium text-sm tracking-wide hover:bg-white/90 transition-all duration-300 button-glow">
              Book a consultation
            </button>

            {/* Mobile hamburger */}
            <button
              className="md:hidden relative w-8 h-6 flex flex-col justify-between items-center z-[60]"
              onClick={() => setMenuOpen(!menuOpen)}
              aria-label="Toggle menu"
            >
              {/* Top line */}
              <span
                className="block w-full h-[2px] bg-white origin-center transition-all duration-500"
                style={{
                  transform: menuOpen ? 'translateY(9px) rotate(45deg)' : 'translateY(0) rotate(0deg)',
                  transitionTimingFunction: 'cubic-bezier(0.22, 1, 0.36, 1)',
                }}
              />
              {/* Middle line */}
              <span
                className="block w-full h-[2px] bg-white origin-center transition-all duration-500"
                style={{
                  opacity: menuOpen ? 0 : 1,
                  transform: menuOpen ? 'scaleX(0)' : 'scaleX(1)',
                  transitionTimingFunction: 'cubic-bezier(0.22, 1, 0.36, 1)',
                }}
              />
              {/* Bottom line */}
              <span
                className="block w-full h-[2px] bg-white origin-center transition-all duration-500"
                style={{
                  transform: menuOpen ? 'translateY(-9px) rotate(-45deg)' : 'translateY(0) rotate(0deg)',
                  transitionTimingFunction: 'cubic-bezier(0.22, 1, 0.36, 1)',
                }}
              />
            </button>
          </nav>

          {/* Mobile slide-in menu */}
          <div
            className="md:hidden fixed top-0 right-0 h-full w-[85%] max-w-[340px] bg-[#0a0608]/95 backdrop-blur-xl border-l border-white/10 z-[55] transition-transform duration-500"
            style={{
              transform: menuOpen ? 'translateX(0)' : 'translateX(100%)',
              transitionTimingFunction: 'cubic-bezier(0.22, 1, 0.36, 1)',
            }}
          >
            <div className="flex flex-col h-full pt-28 px-8 pb-12">
              <div className="flex flex-col gap-6">
                {navLinks.map((link, i) => (
                  <a
                    key={link}
                    href="#"
                    className="text-white/80 hover:text-white text-lg tracking-wide transition-all duration-500"
                    style={{
                      opacity: menuOpen ? 1 : 0,
                      transform: menuOpen ? 'translateX(0)' : 'translateX(40px)',
                      transitionDelay: menuOpen ? (150 + i * 75) + 'ms' : '0ms',
                      transitionTimingFunction: 'cubic-bezier(0.22, 1, 0.36, 1)',
                    }}
                  >
                    {link}
                  </a>
                ))}
              </div>
              <div className="mt-auto">
                <button
                  className="w-full bg-white text-black px-8 py-3.5 rounded-full font-medium text-sm tracking-wide hover:bg-white/90 transition-all duration-500 button-glow"
                  style={{
                    opacity: menuOpen ? 1 : 0,
                    transform: menuOpen ? 'translateY(0)' : 'translateY(20px)',
                    transitionDelay: menuOpen ? '450ms' : '0ms',
                    transitionTimingFunction: 'cubic-bezier(0.22, 1, 0.36, 1)',
                  }}
                >
                  Book a consultation
                </button>
              </div>
            </div>
          </div>

          {/* Overlay */}
          <div
            className={"md:hidden fixed inset-0 z-[54] bg-black/40 transition-opacity duration-500 " + (menuOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none')}
            onClick={() => setMenuOpen(false)}
          />
        </>
      );
    }

    // ========== Hero ==========
    const VIDEO_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260613_180732_a54afbf6-b30d-470e-861f-669871f09f67.mp4';

    function Hero() {
      return (
        <section className="relative h-screen w-full overflow-hidden">
          {/* Background video */}
          <video className="absolute inset-0 w-full h-full object-cover" autoPlay muted loop playsInline>
            <source src={VIDEO_URL} type="video/mp4" />
          </video>

          {/* Dark overlay */}
          <div className="absolute inset-0 bg-black/20" />

          {/* Navbar */}
          <Navbar />

          {/* Center content */}
          <div className="absolute inset-0 flex flex-col items-center justify-center -mt-[120px]">
            <h1 className="font-instrument text-white text-[36px] md:text-7xl lg:text-[110px] leading-[0.9] tracking-tight text-center text-glow">
              Gentle touch. Radiant presence.
            </h1>
            <p className="text-white/70 text-sm md:text-base text-center mt-5 md:mt-7 max-w-xl">
              Expert beauty and holistic wellness, delivered with warmth and intention.
            </p>
            <button className="mt-6 md:mt-9 bg-white text-black px-8 py-3.5 rounded-full font-medium text-sm tracking-wide hover:bg-white/90 transition-all duration-300 button-glow">
              Begin your renewal
            </button>
          </div>

          {/* Sound indicator (desktop only) */}
          <div className="hidden md:flex absolute bottom-8 left-8 items-center gap-3">
            <div className="w-10 h-10 rounded-full border border-white/20 flex items-center justify-center">
              <div className="w-3 h-[2px] bg-white/60" />
            </div>
            <div className="flex flex-col">
              <span className="text-white/60 text-xs">Experience</span>
              <span className="text-white/60 text-xs">with sound</span>
            </div>
          </div>
        </section>
      );
    }

    // ========== QuoteSection ==========
    const RAINBOW_IMG = 'https://soft-zoom-63098134.figma.site/_assets/v11/8d520a7515d06cbfc403d0125e3d05b1a7ccd29c.png';
    const CLOUD_IMG = 'https://soft-zoom-63098134.figma.site/_assets/v11/0d6dfd3f90b930f21726f2ed56a3320d79b7a797.png';
    const QUOTE_TEXT = '\u201CSerene was founded on a belief in beauty that honors your nature. We pursue refined outcomes, considered approaches, and lasting vitality. We spend time learning what matters to you before deciding what serves you best. No rushing, no excess \u2014 just support that lets you feel radiant.\u201D';

    function QuoteSection() {
      const sectionRef = useRef(null);
      const rainbowRef = useRef(null);
      const leftCloudRef = useRef(null);
      const rightCloudRef = useRef(null);

      const state = useRef({
        rainbowY: 120,
        leftCloudX: -200,
        leftCloudY: 0,
        leftCloudOpacity: 0,
        rightCloudX: 200,
        rightCloudY: 0,
        rightCloudOpacity: 0,
      });

      useEffect(() => {
        let rafId;

        const animate = () => {
          const section = sectionRef.current;
          if (!section) {
            rafId = requestAnimationFrame(animate);
            return;
          }

          const rect = section.getBoundingClientRect();
          const wh = window.innerHeight;
          const progress = Math.max(0, Math.min(1, (wh - rect.top) / (wh + rect.height)));

          const s = state.current;

          // Rainbow: +120px -> -160px, lerp factor 0.06
          const targetRainbowY = 120 + progress * (-280);
          s.rainbowY += (targetRainbowY - s.rainbowY) * 0.06;

          // Clouds: in view at progress 0.12-0.92
          const inView = progress >= 0.12 && progress <= 0.92;
          const targetLeftX = inView ? 0 : -200;
          const targetRightX = inView ? 0 : 200;
          const targetOpacity = inView ? 1 : 0;
          const targetCloudY = progress * -50;

          // Left cloud, lerp factor 0.04
          s.leftCloudX += (targetLeftX - s.leftCloudX) * 0.04;
          s.leftCloudY += (targetCloudY - s.leftCloudY) * 0.04;
          s.leftCloudOpacity += (targetOpacity - s.leftCloudOpacity) * 0.04;

          // Right cloud, lerp factor 0.04
          s.rightCloudX += (targetRightX - s.rightCloudX) * 0.04;
          s.rightCloudY += (targetCloudY - s.rightCloudY) * 0.04;
          s.rightCloudOpacity += (targetOpacity - s.rightCloudOpacity) * 0.04;

          // Apply transforms
          if (rainbowRef.current) {
            rainbowRef.current.style.transform = 'translate3d(0, ' + s.rainbowY + 'px, 0)';
          }
          if (leftCloudRef.current) {
            leftCloudRef.current.style.transform = 'translate3d(' + s.leftCloudX + 'px, ' + s.leftCloudY + 'px, 0)';
            leftCloudRef.current.style.opacity = String(s.leftCloudOpacity);
          }
          if (rightCloudRef.current) {
            rightCloudRef.current.style.transform = 'translate3d(' + s.rightCloudX + 'px, ' + s.rightCloudY + 'px, 0)';
            rightCloudRef.current.style.opacity = String(s.rightCloudOpacity);
          }

          rafId = requestAnimationFrame(animate);
        };

        rafId = requestAnimationFrame(animate);
        return () => cancelAnimationFrame(rafId);
      }, []);

      return (
        <section
          ref={sectionRef}
          className="relative h-screen w-full overflow-hidden"
          style={{ background: 'linear-gradient(to bottom, #010A17 0%, #0A4267 30%, #20658E 60%, #6BADC4 100%)' }}
        >
          {/* Rainbow image */}
          <img
            ref={rainbowRef}
            src={RAINBOW_IMG}
            alt=""
            className="absolute inset-x-0 top-0 z-30 w-full will-change-transform pointer-events-none"
            style={{ transform: 'translate3d(0, 120px, 0)' }}
          />

          {/* Left cloud */}
          <img
            ref={leftCloudRef}
            src={CLOUD_IMG}
            alt=""
            className="absolute left-0 bottom-[10%] z-10 hidden sm:block w-[500px] md:w-[650px] will-change-transform pointer-events-none"
            style={{ marginLeft: '-50%', opacity: 0, transform: 'translate3d(-200px, 0, 0)' }}
          />

          {/* Right cloud (flipped) */}
          <img
            ref={rightCloudRef}
            src={CLOUD_IMG}
            alt=""
            className="absolute right-0 bottom-[15%] z-10 hidden sm:block w-[500px] md:w-[650px] scale-x-[-1] will-change-transform pointer-events-none"
            style={{ marginRight: '-75%', opacity: 0, transform: 'translate3d(200px, 0, 0)' }}
          />

          {/* Quote content */}
          <div className="absolute inset-0 z-20 flex flex-col items-center justify-center px-6">
            <div className="max-w-4xl text-center">
              <p className="font-instrument text-white text-xl sm:text-2xl md:text-4xl lg:text-[42px] leading-[1.45] md:leading-[1.5]">
                {QUOTE_TEXT}
              </p>
              <p className="mt-6 md:mt-8 text-white/80 text-sm md:text-base tracking-wide">
                Dr. Mia Callahan — Founder
              </p>
            </div>
          </div>
        </section>
      );
    }

    // ========== App ==========
    function App() {
      return (
        <div className="bg-[#0a0608]">
          <Hero />
          <QuoteSection />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
